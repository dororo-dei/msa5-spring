spring:
  application:
    name: msa5-spring # 애플리케이션 이름

  web:
    error:
      include-stacktrace: never # 기본 오류 응답에 스택 트레이스 미포함
      include-message: never # 기본 오류 응답에 예외 메시지 미포함

logging:
  file:
    name: logs/error.log # (파일 경로 설정)
  level:
    # 로그 중요도: error > warn > info > debug > trace
    root: warn # 전체 애플리케이션의 기본 로그 레벨
    org.msa.msa5spring: error # 해당 패키지의 로그 레벨

debug: false # Spring Boot의 디버그 모드 활성화