spring:
  application:
    # 애플리케이션 이름
    name: msa5-spring

  web:
    error:
      include-stacktrace: never # 기본 오류 응답에 스택 트레이스 미포함
      include-message: never # 기본 오류 응답에 예외 메시지 미포함

  # mySQL 접속 정보 설정
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbsample}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# Mybatis 설정
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.msa.msa5spring

logging:
  file:
    name: logs/error.log # (파일 경로 설정)
  level:
    # 로그 중요도: error > warn > info > debug > trace
    root: warn # 전체 애플리케이션의 기본 로그 레벨
    org.msa.msa5spring: debug # 해당 패키지의 로그 레벨

debug: false # Spring Boot의 디버그 모드 활성화